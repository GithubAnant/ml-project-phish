<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure Account Verification (LOCAL DEMO)</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px; }
      .card { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; }
      .warn { color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="warn">LOCAL PhishGuard demo page — no data is sent anywhere.</p>
      <h1>Sign in to your bank</h1>
      <p>We detected unusual activity. Confirm your credentials.</p>
      <form onsubmit="return false;">
        <label>Username<br /><input type="text" name="user" /></label><br /><br />
        <label>Password<br /><input type="password" name="pass" /></label><br /><br />
        <button type="submit">Verify account</button>
      </form>
      <p><a href="https://example.com/help">Need help?</a></p>
    </div>
  </body>
</html>
